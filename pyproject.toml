[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alacv"
version = "0.1.0"
description = "ALAC-V: visual-first autonomous learning and adaptive cognition — Phase 1 static image encoding"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==4.57.1",
  "safetensors>=0.4",
  "numpy>=1.26",
  "pillow>=10",
  "opencv-python-headless>=4.9",
  "pyyaml>=6",
  "pydantic>=2",
  "pytest>=8",
  "psutil>=5.9",
  "tqdm>=4",
  "matplotlib>=3.8",
  "pyarrow>=15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: requires CUDA",
  "model: requires local DINOv2 weights",
]
